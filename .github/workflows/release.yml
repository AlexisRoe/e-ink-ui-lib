name: Release

# Stages the release on npm via Trusted Publishing (OIDC). No NPM_TOKEN is stored anywhere.
# Flow: bump version in a PR -> merge -> push tag vX.Y.Z on main -> approve the
# `npm-publish` environment -> this workflow stages the package with provenance ->
# a maintainer approves the stage with 2FA on npmjs.com (or `npm stage approve <id>`).

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag matches package.json and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15.0, but the Node pinned in .nvmrc bundles an
      # older npm. Install an exact, pinned version, then verify it below.
      - name: Install pinned npm
        run: npm install --global npm@11.21.3
      - name: Check npm version
        run: |
          npm --version
          node -e "const [a,b]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&b>=15)?0:1)" "$(npm --version)"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run security
      # Uploads the release to npm's staging area only. It goes live after a
      # maintainer approves it with 2FA (npmjs.com or `npm stage approve <id>`).
      - run: npm stage publish --provenance

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # Draft: publish it manually once the npm stage has been approved.
        run: gh release create "$TAG" --repo "$REPO" --generate-notes --verify-tag --draft
